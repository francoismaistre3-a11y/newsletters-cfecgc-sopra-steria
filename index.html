  .header-inner {

    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .logo-area {

    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .logo-badge {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 13px;
    color: white;
    letter-spacing: -0.5px;
    line-height: 1.1;
    text-align: center;
  }

  .logo-text h1 {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.3px;
  }

  .logo-text p {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-top: 1px;
    font-weight: 300;
  }

  .search-wrap {
    flex: 1;
    min-width: 240px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.1);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }

  .search-wrap input::placeholder { color: rgba(255,255,255,0.4); }
  .search-wrap input:focus {
    border-color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.15);
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 15px;
    pointer-events: none;
  }

  .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .clear-btn.visible { display: flex; }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.7);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: rgba(255,255,255,0.5); color: white; }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* MAIN */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px;
  }

  .stats-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .stat-pill {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .stat-pill strong { color: var(--text); }

  .result-count {
    font-size: 13px;
    color: var(--muted);
    margin-left: auto;
  }

  /* NEWSLETTER GROUP */
  .newsletter-group {
    margin-bottom: 32px;
  }

  .group-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }

  .group-month {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: var(--navy);
  }

  .group-badge {
    background: var(--navy);
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .group-file {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
  }

  /* SLIDE GROUP */
  .slide-group { margin-bottom: 18px; }

  .slide-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
    padding-left: 2px;
  }

  .articles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
  }

  /* ARTICLE CARD */
  .article-card {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    text-decoration: none;
    display: block;
    color: inherit;
  }

  .article-card:hover {
    border-color: var(--blue);
    box-shadow: 0 4px 16px rgba(30,79,194,0.12);
    transform: translateY(-1px);
  }

  .article-card.main-title {
    border-left: 4px solid var(--accent);
    background: linear-gradient(135deg, #fffdf9 0%, white 100%);
  }

  .article-card.main-title:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 16px rgba(232,64,28,0.12);
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--navy);
    margin-bottom: 8px;
  }

  .article-card.main-title .card-title {
    font-size: 14px;
  }

  .card-excerpt {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    background: var(--tag-bg);
    color: var(--blue);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .tag.accent {
    background: #fff0ed;
    color: var(--accent);
  }

  .page-ref {
    font-size: 10px;
    color: var(--muted);
    margin-left: auto;
    font-style: italic;
  }

  /* HIGHLIGHT */
  mark {
    background: #fff3a3;
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);

  .empty-state h3 {

    font-size: 18px;

    padding: 16px 24px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    background: white;

    .logo-badge { width: 36px; height: 36px; font-size: 11px; }
    .logo-text h1 { font-size: 13px; }
    main { padding: 16px; }
    .articles-grid { grid-template-columns: 1fr; }

    "full_text": "Se former en inter-contrat ? C’est possible ! Inscription à la dernière minute : Pour rappel, il est souvent possible de s’inscrire à la dernière minute, en particulier pour les formations en interne, et il reste souvent des places. Pour voir les formations qui ont lieu en ce moment ou dans les prochains jours, aller dans Click2Learn, Mon calendrier de formation, puis sélectionner Tous les évènements. Vous pouvez aussi filtrer par mot-clef. Pour chaque formation, le nombre de places disponibles ",
    "is_main_title": false,
    "font_size": 11.0
  },
  {
    "newsletter": "Avril 2026",
    "month": 4,
    "year": 2026,
    "filename": "2026_04_Newsletter_CFE-CGC_v0_1.pptx",
    "slide": 3,
    "title": "Cette étude amusante révèle que le charabia de l’entreprise n’est pas une preuve de performance …",
    "full_text": "Cette étude amusante révèle que le charabia de l’entreprise n’est pas une preuve de performance …",
    "is_main_title": true,
    "font_size": 14.0
  }
];

// ===== STATE =====
let currentFilter = 'all';
let currentSearch = '';

// ===== INIT =====
function init() {
  buildFilters();
  renderStats();
  renderContent();
  setupEvents();
}

function buildFilters() {
  const newsletters = [...new Set(DATA.map(d => d.newsletter))].sort((a,b) => {
    const ma = a.match(/(\d+)/g); const mb = b.match(/(\d+)/g);
    if (ma && mb) return (parseInt(mb[1])*100+parseInt(mb[0])) - (parseInt(ma[1])*100+parseInt(ma[0]));
    return 0;
  });
  const container = document.getElementById('filters');
  newsletters.forEach(nl => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.filter = nl;
    btn.textContent = nl;
    container.appendChild(btn);
  });
}

function renderStats() {
  const total = DATA.length;
  const newsletters = new Set(DATA.map(d => d.newsletter)).size;
  const main = DATA.filter(d => d.is_main_title).length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-pill"><strong>${newsletters}</strong> newsletters</div>
    <div class="stat-pill"><strong>${total}</strong> articles indexés</div>
    <div class="stat-pill"><strong>${main}</strong> articles principaux</div>
    <div class="result-count" id="resultCount"></div>
  `;
}

function highlight(text, query) {
  if (!query) return escHtml(text);
  const parts = escHtml(text).split(new RegExp(`(${escRegex(query)})`, 'gi'));
  return parts.map((p, i) => i % 2 === 1 ? `<mark>${p}</mark>` : p).join('');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function getFiltered() {
  let items = DATA;
  if (currentFilter !== 'all') {
    items = items.filter(d => d.newsletter === currentFilter);
  }
  if (currentSearch.trim()) {
    const q = currentSearch.trim().toLowerCase();
    items = items.filter(d =>
      d.title.toLowerCase().includes(q) ||
      d.full_text.toLowerCase().includes(q) ||
      d.newsletter.toLowerCase().includes(q)
    );
  }
  return items;
}

function renderContent() {
  const items = getFiltered();
  const content = document.getElementById('content');
  const resultCount = document.getElementById('resultCount');

  if (resultCount) {
    resultCount.textContent = currentSearch ? `${items.length} résultat${items.length !== 1 ? 's' : ''}` : '';
  }

  if (items.length === 0) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>Aucun résultat</h3>
        <p>Essayez avec d'autres mots-clés.</p>
      </div>`;
    return;
  }

  // Group by newsletter then slide
  const byNewsletter = {};
  items.forEach(item => {
    if (!byNewsletter[item.newsletter]) byNewsletter[item.newsletter] = {};
    const key = `Slide ${item.slide}`;
    if (!byNewsletter[item.newsletter][key]) byNewsletter[item.newsletter][key] = [];
    byNewsletter[item.newsletter][key].push(item);
  });

  // Sort newsletters by date desc
  const nlOrder = [...new Set(DATA.map(d => d.newsletter))];

  let html = '';
  nlOrder.forEach(nl => {
    if (!byNewsletter[nl]) return;
    const slides = byNewsletter[nl];
    const nlData = DATA.find(d => d.newsletter === nl);
    const articleCount = Object.values(slides).flat().length;

    html += `<div class="newsletter-group">
      <div class="group-header">
        <span class="group-month">${nl}</span>
        <span class="group-badge">${articleCount} article${articleCount>1?'s':''}</span>
        <span class="group-file">📎 ${nlData.filename}</span>
      </div>`;

    const slideLabels = { 'Slide 1': 'Page 1', 'Slide 2': 'Page 2', 'Slide 3': 'Page 3' };
    Object.entries(slides).sort((a,b) => a[0].localeCompare(b[0])).forEach(([slide, slideItems]) => {
      html += `<div class="slide-group">
        <div class="slide-label">${slideLabels[slide] || slide}</div>
        <div class="articles-grid">`;

      slideItems.forEach(item => {
        const q = currentSearch.trim();
        const titleHtml = highlight(item.title, q);
        // Excerpt: second sentence from full_text if available
        let excerptRaw = item.full_text;
        if (excerptRaw.length > item.title.length + 10) {
          excerptRaw = excerptRaw.slice(item.title.length).trim();
        }
        const excerptHtml = excerptRaw ? highlight(excerptRaw.slice(0, 150), q) : '';

        html += `<div class="article-card${item.is_main_title ? ' main-title' : ''}" 
              onclick="openArticle('${escHtml(item.filename)}', ${item.slide})"
              title="Cliquer pour ouvrir ${escHtml(item.filename)} — ${slide}">
          <div class="card-title">${titleHtml}</div>
          ${excerptHtml ? `<div class="card-excerpt">${excerptHtml}</div>` : ''}
          <div class="card-footer">
            ${item.is_main_title ? '<span class="tag accent">Article principal</span>' : '<span class="tag">Sous-rubrique</span>'}
            <span class="page-ref">p.${item.slide}</span>
          </div>
        </div>`;
      });

      html += `</div></div>`;
    });

    html += `</div>`;
  });

  content.innerHTML = html;
}

function openArticle(filename, slide) {
  // Opens the PPTX file if it's accessible locally, or shows info
  // Since this is a local index, we just show a notification
  const msg = `Fichier : ${filename}\nDans votre explorateur : ouvrir le PPTX et aller à la page ${slide}`;
  
  // Try to create a link to the file
  const anchor = document.createElement('a');
  anchor.href = filename;
  anchor.target = '_blank';
  
  // Show a toast instead
  showToast(`📄 ${filename} — Page ${slide}`);
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = `
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:var(--navy); color:white; padding:10px 20px; border-radius:8px;
      font-size:13px; z-index:9999; max-width:80vw; text-align:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.3); transition:opacity 0.3s;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 3500);
}

function setupEvents() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');

  input.addEventListener('input', () => {
    currentSearch = input.value;
    clearBtn.classList.toggle('visible', currentSearch.length > 0);
    renderContent();
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    currentSearch = '';
    clearBtn.classList.remove('visible');
    input.focus();
    renderContent();
  });

  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderContent();
  });
}

init();
</script>
</body>
</html>
