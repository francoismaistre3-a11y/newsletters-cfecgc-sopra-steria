<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletters CFE-CGC Sopra Steria</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #0056b3;
            margin-bottom: 20px;
        }
        .search-container {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }
        #search {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .button {
            padding: 10px 15px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #003d7a;
        }
        .article-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        .article {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            background: white;
            transition: transform 0.2s;
        }
        .article:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .article h2 {
            margin-top: 0;
            color: #0056b3;
            font-size: 18px;
        }
        .article .meta {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .article .keywords {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        .article a {
            color: #0056b3;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .article a:hover {
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h2 {
            margin: 0;
            color: #0056b3;
        }
        .close {
            font-size: 24px;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-group textarea {
            height: 60px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .delete-btn {
            background-color: #dc3545;
        }
        .delete-btn:hover {
            background-color: #a71d2a;
        }
        .edit-btn {
            background-color: #28a745;
            margin-right: 10px;
        }
        .edit-btn:hover {
            background-color: #1e7e34;
        }
        .article-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Newsletters CFE-CGC Sopra Steria</h1>
        
        <div class="search-container">
            <input type="text" id="search" placeholder="Rechercher un article...">
            <button class="button" onclick="openAddModal()">Ajouter un article</button>
        </div>
        
        <div class="article-list" id="articleList">
            <!-- Les articles seront chargés ici -->
        </div>
    </div>

    <!-- Modal pour ajouter/modifier un article -->
    <div id="articleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Ajouter un article</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="articleForm">
                <input type="hidden" id="articleIndex">
                <div class="form-group">
                    <label for="titre">Titre *</label>
                    <input type="text" id="titre" required>
                </div>
                <div class="form-group">
                    <label for="pdf_url">Lien vers le PDF (ex: pdf/2026_05.pdf#page=1) *</label>
                    <input type="text" id="pdf_url" required>
                </div>
                <div class="form-group">
                    <label for="newsletter">Newsletter (ex: 2026_05)</label>
                    <input type="text" id="newsletter">
                </div>
                <div class="form-group">
                    <label for="page">Page</label>
                    <input type="number" id="page">
                </div>
                <div class="form-group">
                    <label for="mots_cles">Mots-clés (séparés par des virgules)</label>
                    <input type="text" id="mots_cles">
                </div>
                <div class="form-group">
                    <label for="actif">Actif</label>
                    <input type="checkbox" id="actif" checked>
                </div>
                <div class="modal-footer">
                    <button type="button" class="button delete-btn" onclick="deleteArticle()" id="deleteBtn" style="display: none;">Supprimer</button>
                    <button type="button" class="button" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="button">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let articles = [];

        // Charger les articles depuis le JSON
        fetch('data/articles.json')
            .then(response => response.json())
            .then(data => {
                articles = data.articles;
                displayArticles(articles);
            })
            .catch(error => {
                console.error('Erreur de chargement du JSON:', error);
                // Si le JSON n'existe pas, on charge un exemple par défaut
                articles = [
                    {
                        "titre": "Pour une vraie politique seniors à Sopra Steria…",
                        "pdf_url": "pdf/2026_05_Newsletter_CFE-CGC_v0_1.pdf#page=1",
                        "newsletter": "2026_05",
                        "page": 1,
                        "mots_cles": ["seniors", "politique", "santé", "ergonomie"],
                        "actif": true
                    },
                    {
                        "titre": "Quand trop d'info tue l'info",
                        "pdf_url": "pdf/2026_05_Newsletter_CFE-CGC_v0_1.pdf#page=2",
                        "newsletter": "2026_05",
                        "page": 2,
                        "mots_cles": ["infobésité", "communication", "outils numériques"],
                        "actif": true
                    },
                    {
                        "titre": "L'impact de l'IA sur l'emploi",
                        "pdf_url": "pdf/2026_05_Newsletter_CFE-CGC_v0_1.pdf#page=3",
                        "newsletter": "2026_05",
                        "page": 3,
                        "mots_cles": ["IA", "emploi", "licenciement", "Oracle"],
                        "actif": true
                    },
                    {
                        "titre": "Compte Épargne Temps (CET)",
                        "pdf_url": "pdf/2026_05_Newsletter_CFE-CGC_v0_1.pdf#page=4",
                        "newsletter": "2026_05",
                        "page": 4,
                        "mots_cles": ["CET", "congés", "épargne"],
                        "actif": true
                    },
                    {
                        "titre": "Jours de congés à écouler avant fin mai : Pensez au don de jours",
                        "pdf_url": "pdf/2026_05_Newsletter_CFE-CGC_v0_1.pdf#page=4",
                        "newsletter": "2026_05",
                        "page": 4,
                        "mots_cles": ["congés", "don", "solidarité"],
                        "actif": true
                    },
                    {
                        "titre": "Le Compte Personnel de Formation – Comment l’utiliser ?",
                        "pdf_url": "pdf/2026_05_Newsletter_CFE-CGC_v0_1.pdf#page=5",
                        "newsletter": "2026_05",
                        "page": 5,
                        "mots_cles": ["CPF", "formation", "droits"],
                        "actif": true
                    },
                    {
                        "titre": "Subvention Sport Culture – 90€ (SSG)",
                        "pdf_url": "pdf/2026_05_Newsletter_CFE-CGC_v0_1.pdf#page=5",
                        "newsletter": "2026_05",
                        "page": 5,
                        "mots_cles": ["sport", "culture", "subvention", "SSG"],
                        "actif": true
                    },
                    {
                        "titre": "Résultats du T1 : Excellents ! La bourse apprécie...",
                        "pdf_url": "pdf/2026_05_Newsletter_CFE-CGC_v0_1.pdf#page=6",
                        "newsletter": "2026_05",
                        "page": 6,
                        "mots_cles": ["résultats", "bourse", "actionnaires", "salaires"],
                        "actif": true
                    },
                    {
                        "titre": "Retours de CRH, suite",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=1",
                        "newsletter": "2026_04",
                        "page": 1,
                        "mots_cles": ["CRH", "augmentations", "sélectivité", "DHG"],
                        "actif": true
                    },
                    {
                        "titre": "Télétravail : Bilan 2025",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=2",
                        "newsletter": "2026_04",
                        "page": 2,
                        "mots_cles": ["télétravail", "bilan", "2025"],
                        "actif": true
                    },
                    {
                        "titre": "Participation et Intéressement, comment les gérer (PEE, PERECO, ou paiement)?",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=2",
                        "newsletter": "2026_04",
                        "page": 2,
                        "mots_cles": ["participation", "intéressement", "PEE", "PERECO"],
                        "actif": true
                    },
                    {
                        "titre": "Seniors",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=3",
                        "newsletter": "2026_04",
                        "page": 3,
                        "mots_cles": ["seniors", "PERECO", "retraite", "optimisation"],
                        "actif": true
                    },
                    {
                        "titre": "Nouveaux élus CFE-CGC",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=3",
                        "newsletter": "2026_04",
                        "page": 3,
                        "mots_cles": ["élus", "CFE-CGC", "Arnaud DE BATZ", "Isabelle JULIA"],
                        "actif": true
                    },
                    {
                        "titre": "Rupture Conventionnelle",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=3",
                        "newsletter": "2026_04",
                        "page": 3,
                        "mots_cles": ["rupture conventionnelle", "indemnisation", "seniors"],
                        "actif": true
                    },
                    {
                        "titre": "Formations – Bilan 2025 et Plan 2026",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=4",
                        "newsletter": "2026_04",
                        "page": 4,
                        "mots_cles": ["formations", "bilan", "2025", "2026", "certifications"],
                        "actif": true
                    },
                    {
                        "titre": "Cette étude amusante révèle que le charabia de l'entreprise n'est pas une preuve de performance...",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=4",
                        "newsletter": "2026_04",
                        "page": 4,
                        "mots_cles": ["étude", "jargon", "performance", "management"],
                        "actif": true
                    },
                    {
                        "titre": "Se former en inter-contrat ? C'est possible !",
                        "pdf_url": "pdf/2026_04_Newsletter_CFE-CGC_v0_1.pdf#page=5",
                        "newsletter": "2026_04",
                        "page": 5,
                        "mots_cles": ["formation", "inter-contrat", "Click2Learn"],
                        "actif": true
                    }
                ];
                displayArticles(articles);
            });

        // Afficher les articles
        function displayArticles(articlesToDisplay) {
            const articleList = document.getElementById('articleList');
            articleList.innerHTML = '';

            articlesToDisplay.forEach((article, index) => {
                if (article.actif) {
                    const articleElement = document.createElement('div');
                    articleElement.className = 'article';
                    articleElement.dataset.keywords = article.mots_cles.join(', ');

                    const keywordsText = article.mots_cles.length > 0 
                        ? `<div class="keywords">Mots-clés: ${article.mots_cles.join(', ')}</div>` 
                        : '';

                    articleElement.innerHTML = `
                        <h2>${article.titre}</h2>
                        <div class="meta">
                            Newsletter: ${article.newsletter} | Page: ${article.page}
                        </div>
                        ${keywordsText}
                        <a href="${article.pdf_url}" target="_blank">Lire l'article</a>
                        <div class="article-actions">
                            <button class="button edit-btn" onclick="openEditModal(${index})">Modifier</button>
                        </div>
                    `;

                    articleList.appendChild(articleElement);
                }
            });
        }

        // Recherche
        document.getElementById('search').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const filteredArticles = articles.filter(article => {
                const titleMatch = article.titre.toLowerCase().includes(query);
                const keywordsMatch = article.mots_cles.some(kw => kw.toLowerCase().includes(query));
                const newsletterMatch = article.newsletter.toLowerCase().includes(query);
                return titleMatch || keywordsMatch || newsletterMatch;
            });
            displayArticles(filteredArticles);
        });

        // Modals
        const modal = document.getElementById('articleModal');
        const form = document.getElementById('articleForm');

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Ajouter un article';
            document.getElementById('articleIndex').value = '';
            document.getElementById('titre').value = '';
            document.getElementById('pdf_url').value = '';
            document.getElementById('newsletter').value = '';
            document.getElementById('page').value = '';
            document.getElementById('mots_cles').value = '';
            document.getElementById('actif').checked = true;
            document.getElementById('deleteBtn').style.display = 'none';
            modal.style.display = 'block';
        }

        function openEditModal(index) {
            const article = articles[index];
            document.getElementById('modalTitle').textContent = 'Modifier un article';
            document.getElementById('articleIndex').value = index;
            document.getElementById('titre').value = article.titre;
            document.getElementById('pdf_url').value = article.pdf_url;
            document.getElementById('newsletter').value = article.newsletter;
            document.getElementById('page').value = article.page;
            document.getElementById('mots_cles').value = article.mots_cles.join(', ');
            document.getElementById('actif').checked = article.actif;
            document.getElementById('deleteBtn').style.display = 'block';
            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function saveArticle(event) {
            event.preventDefault();
            const index = document.getElementById('articleIndex').value;
            const article = {
                titre: document.getElementById('titre').value,
                pdf_url: document.getElementById('pdf_url').value,
                newsletter: document.getElementById('newsletter').value,
                page: parseInt(document.getElementById('page').value) || 1,
                mots_cles: document.getElementById('mots_cles').value.split(',').map(kw => kw.trim()),
                actif: document.getElementById('actif').checked
            };

            if (index === '') {
                articles.push(article);
            } else {
                articles[index] = article;
            }

            // Sauvegarder dans le JSON (simulé ici, en vrai il faudrait une API ou un système de fichiers)
            saveArticlesToJSON();
            displayArticles(articles);
            closeModal();
        }

        function deleteArticle() {
            const index = document.getElementById('articleIndex').value;
            if (index !== '') {
                articles[index].actif = false;
                saveArticlesToJSON();
                displayArticles(articles);
                closeModal();
            }
        }

        // Sauvegarder les articles dans le JSON (simulation pour GitHub Pages)
        function saveArticlesToJSON() {
            const data = { articles: articles };
            // En local, on ne peut pas écrire directement dans un fichier JSON sur GitHub Pages.
            // Il faudrait utiliser GitHub API ou un backend. Pour l'instant, on affiche un message.
            alert('Pour sauvegarder les modifications, téléchargez le fichier JSON mis à jour et remplacez-le dans votre dépôt GitHub.');
            console.log('Nouveau JSON:', JSON.stringify(data, null, 2));
        }

        // Événements
        form.addEventListener('submit', saveArticle);
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
