<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletters CFE-CGC Sopra Steria</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #f8f9fa;
            --admin-bg: #fff3cd;
            --article-bg: #f8f9fa;
            --text-color: #333;
            --light-text: #666;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f7fa;
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        /* Barre de recherche */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        #search {
            flex: 1;
            max-width: 600px;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #search:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Mode admin */
        .admin-banner {
            display: none;
            background-color: var(--admin-bg);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            color: #856404;
        }

        .admin-banner.show {
            display: block;
        }

        /* Liste des articles */
        .article-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        /* Carte article (mode présentation) */
        .article-card {
            background-color: var(--article-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border-left: 5px solid var(--primary-color);
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .article-card h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .article-card .resume {
            font-size: 0.9em;
            color: var(--light-text);
            font-style: italic;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .article-card .meta {
            font-size: 0.8em;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        /* Boutons admin */
        .article-actions {
            display: none;
            margin-top: 15px;
            gap: 10px;
        }

        .article-actions.show {
            display: flex;
        }

        .button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .button-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .button-primary:hover {
            background-color: #003d7a;
        }

        .button-edit {
            background-color: #28a745;
            color: white;
        }

        .button-edit:hover {
            background-color: #1e7e34;
        }

        .button-delete {
            background-color: #dc3545;
            color: white;
        }

        .button-delete:hover {
            background-color: #a71d2a;
        }

        .button-add {
            background-color: #6c757d;
            color: white;
        }

        .button-add:hover {
            background-color: #5a6268;
        }

        /* Modal pour ajouter/modifier */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-header h2 {
            margin: 0;
            color: var(--primary-color);
        }

        .close {
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }

        .close:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--text-color);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        /* Couleurs prédéfinies pour les articles */
        .color-option {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 5px;
            cursor: pointer;
            border: 2px solid #ddd;
        }

        .color-option.selected {
            border: 2px solid var(--primary-color);
        }

        .color-palette {
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .article-list {
                grid-template-columns: 1fr;
            }
            
            .search-container {
                flex-direction: column;
                align-items: center;
            }
            
            #search {
                max-width: 100%;
            }
        }
    </style>
</head>

                </div>
                <div class="form-group">

                <div class="modal-footer">
                    <button type="button" class="button button-delete" onclick="deleteArticle()" id="deleteBtn" style="display: none;">Supprimer</button>

        // Afficher les articles
        function displayArticles(articlesToDisplay) {
            const articleList = document.getElementById('articleList');
            articleList.innerHTML = '';

            articlesToDisplay.forEach((article, index) => {
                if (article.actif) {
                    const articleElement = document.createElement('div');
                    articleElement.className = 'article-card';
                    articleElement.style.backgroundColor = article.couleur || '#f8f9fa';
                    articleElement.onclick = function() {
                        window.open(article.pdf_url, '_blank');
                    };

                    const metaInfo = `Newsletter: ${article.newsletter} | Page: ${article.page}`;
                    const resumeText = article.resume ? `<p class="resume">${article.resume}</p>` : '';

                    articleElement.innerHTML = `
                        <h2>${article.titre}</h2>
                        ${resumeText}
                        <div class="meta">
                            <span>${metaInfo}</span>
                        </div>
                    `;

                    // Ajouter les boutons admin si le mode admin est activé
                    if (isAdmin) {
                        const actionsDiv = document.createElement('div');
                        actionsDiv.className = 'article-actions show';
                        actionsDiv.innerHTML = `
                            <button class="button button-edit" onclick="event.stopPropagation(); openEditModal(${index});">Modifier</button>
                        `;
                        articleElement.appendChild(actionsDiv);
                        // Désactiver le clic sur la carte si on clique sur un bouton
                        actionsDiv.onclick = function(e) {
                            e.stopPropagation();
                        };
                    }

                    articleList.appendChild(articleElement);
                }
            });
        }

        // Recherche
        document.getElementById('search').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const filteredArticles = articles.filter(article => {
                const titleMatch = article.titre.toLowerCase().includes(query);
                const keywordsMatch = article.mots_cles.some(kw => kw.toLowerCase().includes(query));
                const resumeMatch = article.resume ? article.resume.toLowerCase().includes(query) : false;
                const newsletterMatch = article.newsletter.toLowerCase().includes(query);
                return titleMatch || keywordsMatch || resumeMatch || newsletterMatch;
            });
            displayArticles(filteredArticles);
        });

        // Modals
        const modal = document.getElementById('articleModal');
        const form = document.getElementById('articleForm');

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Ajouter un article';
            document.getElementById('articleIndex').value = '';
            document.getElementById('titre').value = '';
            document.getElementById('pdf_url').value = '';
            document.getElementById('newsletter').value = '';
            document.getElementById('page').value = '';
            document.getElementById('resume').value = '';
            document.getElementById('mots_cles').value = '';
            document.getElementById('couleur').value = '#f8f9fa';
            document.getElementById('actif').checked = true;
            document.getElementById('deleteBtn').style.display = 'none';
            modal.style.display = 'block';
        }

        function openEditModal(index) {
            const article = articles[index];
            document.getElementById('modalTitle').textContent = 'Modifier un article';
            document.getElementById('articleIndex').value = index;
            document.getElementById('titre').value = article.titre;
            document.getElementById('pdf_url').value = article.pdf_url;
            document.getElementById('newsletter').value = article.newsletter;
            document.getElementById('page').value = article.page;
            document.getElementById('resume').value = article.resume || '';
            document.getElementById('mots_cles').value = article.mots_cles.join(', ');
            document.getElementById('couleur').value = article.couleur || '#f8f9fa';
            document.getElementById('actif').checked = article.actif;
            document.getElementById('deleteBtn').style.display = 'block';
            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function setColor(color) {
            document.getElementById('couleur').value = color;
            // Retirer la classe selected de tous les color-option
            document.querySelectorAll('.color-option').forEach(el => {
                el.classList.remove('selected');
            });
            // Ajouter la classe selected à l'option cliquée
            event.target.classList.add('selected');
        }

        function saveArticle(event) {
            event.preventDefault();
            const index = document.getElementById('articleIndex').value;
            const article = {
                titre: document.getElementById('titre').value,
                pdf_url: document.getElementById('pdf_url').value,
                newsletter: document.getElementById('newsletter').value,
                page: parseInt(document.getElementById('page').value) || 1,
                resume: document.getElementById('resume').value,
                mots_cles: document.getElementById('mots_cles').value.split(',').map(kw => kw.trim()),
                couleur: document.getElementById('couleur').value,
                actif: document.getElementById('actif').checked
            };

            if (index === '') {
                articles.push(article);
            } else {
                articles[index] = article;
            }

            // Sauvegarder dans le JSON (simulé ici)
            saveArticlesToJSON();
            displayArticles(articles);
            closeModal();
        }

        function deleteArticle() {
            const index = document.getElementById('articleIndex').value;
            if (index !== '') {
                if (confirm('Voulez-vous vraiment supprimer cet article ?')) {
                    articles[index].actif = false;
                    saveArticlesToJSON();
                    displayArticles(articles);
                    closeModal();
                }
            }
        }

        // Sauvegarder les articles dans le JSON (simulation pour GitHub Pages)
        function saveArticlesToJSON() {
            const data = { articles: articles };
            // En local, on ne peut pas écrire directement dans un fichier JSON sur GitHub Pages.
            // Il faudrait utiliser GitHub API ou un backend. Pour l'instant, on affiche un message.
            alert('Pour sauvegarder les modifications :\n\n1. Copiez ce JSON :\n\n' + JSON.stringify(data, null, 2) + '\n\n2. Collez-le dans le fichier data/articles.json de votre dépôt GitHub.');
            console.log('Nouveau JSON:', JSON.stringify(data, null, 2));
        }

        // Événements
        form.addEventListener('submit', saveArticle);
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // Initialisation
        checkAdminMode();
        loadArticles();
    </script>
</body>
</html>
